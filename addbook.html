<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Add Book</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.js"></script>
</head>

<body>
    <header>
        <div class="set-100">
            <div class="set-50">
                <a href="index.html" class="owl-image">
                    <img src="assets/image/owl.png" alt="Library Logo" class="logo-image" height="80" width="80">
                </a>
            </div>

            <nav class="home-navbar">
                <ul class="home-nav-list">
                    <li><a href="viewbook.html">View Books</a></li>
                    <li class="active"><a href="addbook.html">Add Book</a></li>
                    <li><a href="issuebook.html">Issue Book</a></li>
                    <li><a href="members.html">Members</a></li>
                    <li><a href="returnbook.html">Return Book</a></li>
                    <li><a href="read.html">Read Books</a></li>
                    <li><a href="purchase.html">Purchase Books</a></li>
                    <button id="themeToggle" onclick="toggleTheme()">🌙</button>
                </ul>
            </nav>

            <div class="home-search">
                <input type="text" placeholder="Search books..." class="search-input">
                <button type="button" class="search-button">Search</button>
            </div>

            <div class="set-50">
                <a href="cart.html">
                    <img src="assets/image/cart.png" alt="Cart" class="cart-image">
                </a>
            </div>
        </div>
    </header>

    <form>

        <!-- 1st Row: Book Name, Book Type, Book Image -->
        <div class="form-row">

            <div class="form-group">
                <label for="bookName">Book Name:</label>
                <input type="text" class="form-control" id="bookName" required>
            </div>

            <div class="form-group">
                <label for="bookType">Book Type:</label>
                <input type="text" id="bookType" list="categories" placeholder="Search or enter category" required>

                <datalist id="categories">
                    <option value="Academic">
                    <option value="Adventure">
                    <option value="Art & Photography">
                    <option value="Biography">
                    <option value="Business">
                    <option value="Children">
                    <option value="Classic Literature">
                    <option value="Comedy">
                    <option value="Computer & Technology">
                    <option value="Crime">
                    <option value="Drama">
                    <option value="Education">
                    <option value="Fantasy">
                    <option value="Fiction">
                    <option value="Health & Fitness">
                    <option value="Historical Fiction">
                    <option value="History">
                    <option value="Horror">
                    <option value="Literature">
                    <option value="Mathematics">
                    <option value="Medical">
                    <option value="Mystery">
                    <option value="Non-Fiction">
                    <option value="Philosophy">
                    <option value="Poetry">
                    <option value="Politics">
                    <option value="Psychology">
                    <option value="Religion & Spirituality">
                    <option value="Romance">
                    <option value="Science">
                    <option value="Science Fiction">
                    <option value="Self-Help">
                    <option value="Sports">
                    <option value="Thriller">
                    <option value="Travel">
                    <option value="Young Adult">
                    <option value="Agriculture">
                    <option value="Architecture">
                    <option value="Astronomy">
                    <option value="Comics & Graphic Novels">
                    <option value="Cooking & Food">
                    <option value="Cultural Studies">
                    <option value="Economics">
                    <option value="Engineering">
                    <option value="Environment">
                    <option value="Essays">
                    <option value="Fashion">
                    <option value="Geography">
                    <option value="Geology">
                    <option value="Government">
                    <option value="Journalism">
                    <option value="Law">
                    <option value="Linguistics">
                    <option value="Management">
                    <option value="Marketing">
                    <option value="Military History">
                    <option value="Music">
                    <option value="Mythology">
                    <option value="Parenting">
                    <option value="Reference Books">
                    <option value="Social Science">
                    <option value="Sociology">
                    <option value="Technology">
                    <option value="Theology">
                    <option value="Transportation">
                    <option value="Veterinary Science">
                </datalist>
            </div>

            <div class="form-group image-upload-group">
                <label for="bookImage">Book Image:</label>
                <input type="file" id="bookImage" accept="image/*" onchange="previewImage(event)">
                <img id="imagePreview" src="" alt="Book Preview" width="120" style="display: none;">
            </div>

        </div>

        <!-- 2nd Row: Add to Homepage, Author, Publisher -->
        <div class="form-row">

            <div class="form-group">
                <label for="addToHomepage">Add to Homepage?</label>
                <select id="addToHomepage" class="form-control">
                    <option value="no">No</option>
                    <option value="yes">Yes</option>
                </select>
            </div>

            <div class="form-group">
                <label for="author">Author:</label>
                <input type="text" class="form-control" id="author" required>
            </div>

            <div class="form-group">
                <label for="publisher">Publisher:</label>
                <input type="text" id="publisher" required>
            </div>

        </div>

        <!-- 3rd Row: Language, Print Length, Dimensions -->
        <div class="form-row">

            <div class="form-group">
                <label for="language">Language:</label>
                <input type="text" id="language" required>
            </div>

            <div class="form-group">
                <label for="printLength">Print Length:</label>
                <input type="number" id="printLength" min="1" required>
            </div>

            <div class="form-group">
                <label for="dimensions">Dimensions:</label>
                <input type="text" id="dimensions" placeholder="20 x 13 x 2 cm" required>
            </div>

        </div>

        <!-- 4th Row: Book Price, Available Quantity -->
        <div class="form-row">

            <div class="form-group">
                <label for="price">Book Price:</label>
                <input type="number" id="price" min="1" required>
            </div>

            <div class="form-group">
                <label for="quantity">Available Quantity:</label>
                <input type="number" id="quantity" min="0" required>
            </div>

        </div>

        <label>Book Description:</label>
        <div id="bookDescription" style="height: 100px;"></div>

        <button type="button" onclick="addBook()">Submit</button>

    </form>

    <div style="display: flex; justify-content: center; align-items: center;">
        <a href="index.html" class="button-back-home">Back to Home</a>
    </div>

    <br>

    <script src="assets/js/script.js"></script>

    <script>
        var quill = new Quill('#bookDescription', {
            theme: 'snow'
        });
    </script>

</body>

</html>
